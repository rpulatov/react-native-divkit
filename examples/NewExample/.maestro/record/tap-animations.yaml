appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Tap Animations"
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/tap-animations
    cropOn:
      id: "divkit-snapshot-area"
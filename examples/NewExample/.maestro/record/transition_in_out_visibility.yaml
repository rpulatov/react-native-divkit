appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Transition In/Out Visibility"
- extendedWaitUntil:
    visible:
      id: "divkit-content-ready"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/transition_in_out_visibility
    cropOn:
      id: "divkit-snapshot-area"
- swipe:
    from:
      id: "divkit-snapshot-area"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "divkit-content-ready"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/transition_in_out_visibility_part_2
    cropOn:
      id: "divkit-snapshot-area"

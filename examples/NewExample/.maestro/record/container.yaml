appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Container"
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/container
    cropOn:
      id: "divkit-snapshot-area"

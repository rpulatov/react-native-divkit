appId: com.newexample
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 30000
- tapOn: "Example Variables"
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/state-switching
    cropOn:
      id: "divkit-snapshot-area"

appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Variables"
- extendedWaitUntil:
    visible:
      id: "divkit-content-ready"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/variables
    cropOn:
      id: "divkit-snapshot-area"

appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Pager + Indicator"
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/pager-with-indicator
    cropOn:
      id: "divkit-snapshot-area"
- swipe:
    from:
      id: "pager_with_indicator"
    direction: LEFT
- waitForAnimationToEnd
- takeScreenshot:
    path: .maestro/goldens/android/pager-with-indicator_part2
    cropOn:
      id: "divkit-snapshot-area"

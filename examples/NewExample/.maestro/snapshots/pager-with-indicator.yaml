appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Pager + Indicator"
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 30000
- waitForAnimationToEnd
- assertScreenshot:
    path: .maestro/goldens/android/pager-with-indicator.png
    cropOn:
      id: "divkit-snapshot-area"
    thresholdPercentage: 98
- swipe:
    from:
      id: "pager_with_indicator"
    direction: LEFT
- waitForAnimationToEnd
- assertScreenshot:
    path: .maestro/goldens/android/pager-with-indicator_part2.png
    cropOn:
      id: "divkit-snapshot-area"
    thresholdPercentage: 98

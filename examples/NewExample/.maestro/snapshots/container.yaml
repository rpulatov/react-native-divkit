appId: com.newexample
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 30000
- tapOn: "Example Container"
- waitForAnimationToEnd
- assertScreenshot:
    path: .maestro/goldens/android/container.png
    cropOn:
      id: "divkit-snapshot-area"
    thresholdPercentage: 98

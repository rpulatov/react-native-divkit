appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Transition In/Out Visibility"
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 30000
- waitForAnimationToEnd
- assertScreenshot:
    path: .maestro/goldens/android/transition_in_out_visibility.png
    cropOn:
      id: "divkit-snapshot-area"
    thresholdPercentage: 98
- swipe:
    from:
      id: "divkit-snapshot-area"
    direction: UP
- waitForAnimationToEnd
- assertScreenshot:
    path: .maestro/goldens/android/transition_in_out_visibility_part_2.png
    cropOn:
      id: "divkit-snapshot-area"
    thresholdPercentage: 98

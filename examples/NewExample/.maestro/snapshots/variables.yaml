appId: com.newexample
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 30000
- scrollUntilVisible:
    element:
      point: 0%,22%
- tapOn: "Example Variables"
- waitForAnimationToEnd
- assertScreenshot:
    path: .maestro/goldens/android/variables.png
    cropOn:
      id: "divkit-snapshot-area"
    thresholdPercentage: 98

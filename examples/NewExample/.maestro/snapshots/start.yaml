appId: com.newexample
---
- launchApp:
    clearState: true
    arguments:
      snapshotMode: true
      initialExample: "Start"
- extendedWaitUntil:
    visible:
      id: "divkit-snapshot-area"
    timeout: 30000
- waitForAnimationToEnd
- assertScreenshot:
    path: .maestro/goldens/android/start.png
    cropOn:
      id: "divkit-snapshot-area"
    thresholdPercentage: 98

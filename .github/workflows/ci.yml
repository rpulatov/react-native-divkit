name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      maestro_android_mode:
        description: Verify snapshots or record new Android goldens
        required: true
        type: choice
        default: verify
        options:
          - verify
          - record

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Snapshot tests
        run: npm run test:snapshot

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/NewExample

      - name: Test example
        run: npm test
        working-directory: examples/NewExample

  maestro-android-snapshots:
    name: Maestro Android Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/NewExample/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/NewExample

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build example Android app
        run: npm run e2e:android:build
        working-directory: examples/NewExample

      - name: Run Maestro snapshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_ANDROID_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.maestro_android_mode || 'verify' }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-maestro-android.sh

      - name: Commit updated Maestro Android goldens
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.maestro_android_mode == 'record' }}
        run: |
          if git diff --quiet -- examples/NewExample/.maestro/goldens/android; then
            echo "No Maestro Android golden changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/NewExample/.maestro/goldens/android
          git commit -m "Update Maestro Android snapshots"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-output
          path: |
            examples/NewExample/.maestro/output
            examples/NewExample/metro.log

      - name: Upload Maestro Android goldens
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.maestro_android_mode == 'record' }}
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-goldens
          path: examples/NewExample/.maestro/goldens/android

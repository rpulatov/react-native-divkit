name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Snapshot tests
        run: npm run test:snapshot

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/NewExample

      - name: Test example
        run: npm test
        working-directory: examples/NewExample

  maestro-android-snapshots:
    name: Maestro Android Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/NewExample/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/NewExample

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build example Android app
        run: npm run e2e:android:build
        working-directory: examples/NewExample

      - name: Run Maestro snapshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_9_pro
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            cd examples/NewExample
            npm start -- --port 8081 > metro.log 2>&1 &
            METRO_READY=0
            for i in {1..60}; do
              if curl -fsS http://localhost:8081/status | grep -q "packager-status:running"; then
                METRO_READY=1
                break
              fi
              sleep 2
            done
            if [ "$METRO_READY" != "1" ]; then
              echo "Metro did not become ready in time"
              cat metro.log
              exit 1
            fi
            npm run e2e:android:install
            npm run e2e:maestro:android

      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-output
          path: |
            examples/NewExample/.maestro/output
            examples/NewExample/metro.log
